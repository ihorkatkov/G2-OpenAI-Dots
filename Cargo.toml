[package]
name = "g2-dot-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Connect Even G2 glasses to a personal ChatGPT Dot"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rune-ip = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
shlex = "2"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros","rt-multi-thread","net","sync","signal","time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json","blocking"] }
tempfile = "3"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }

[profile.release]
strip = true
